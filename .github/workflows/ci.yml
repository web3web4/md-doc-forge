name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc-3.6.4-1-amd64.deb

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Install LibreOffice and fonts
        run: sudo apt-get install -y libreoffice fonts-liberation fonts-dejavu

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Smoke-test CLI end-to-end
        run: |
          cd tests/fixtures
          md-doc-forge build --format all
          test -f generated/sample.docx
          test -f generated/sample.typst.pdf
          test -f generated/sample.odt
          test -f generated/sample.pdf
